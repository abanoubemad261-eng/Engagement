name: Fix photo compositing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-photo:
    if: ${{ !contains(github.event.head_commit.message, 'Fix saved photo clipping') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch photo compositing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = "x.drawImage(p,px+(pw-p.width*scale)/2,py+(ph-p.height*scale)/2,p.width*scale,p.height*scale);return new Promise"
          new = "x.save();x.beginPath();x.rect(px,py,pw,ph);x.clip();x.drawImage(p,px+(pw-p.width*scale)/2,py+(ph-p.height*scale)/2,p.width*scale,p.height*scale);x.restore();return new Promise"
          if old not in s:
              raise SystemExit('target code not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Fix saved photo clipping"
          git push
