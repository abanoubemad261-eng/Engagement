<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f2eb" />
    <meta name="description" content="Our engagement invitation" />
    <title>Our Engagement</title>
    <link rel="stylesheet" href="/src/navigation.css" />
    <style>
      /* Home hero background only */
      #home.hero {
        background-image: linear-gradient(rgba(247, 242, 235, 0.28), rgba(247, 242, 235, 0.28)), url('/0.jpeg') !important;
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
      }

      /* Music is started from Open Invitation; no separate music control needed. */
      .music-btn { display: none !important; }
    </style>
    <script>
      // iOS/Safari does not always honor the download attribute for blob URLs.
      // For Save actions, open the generated image directly so the user can
      // long-press and save it when automatic download is unavailable.
      document.addEventListener('click', function (event) {
        const button = event.target.closest('button');
        if (!button || !/\bSave\b/.test(button.textContent || '')) return;

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (!isIOS) return;

        const originalClick = event;
        setTimeout(function () {
          const links = Array.from(document.querySelectorAll('a[download]'));
          const link = links[links.length - 1];
          if (!link || !link.href) return;
          event.preventDefault();
          window.open(link.href, '_blank', 'noopener,noreferrer');
        }, 0);
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
